<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AiDevation Persona Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;900&display=swap');

        body { 
            font-family: 'M PLUS 1p', 'Segoe UI', sans-serif; 
            /* 明るく爽やかなブルーグレーの背景 */
            background: #f0fdfa; 
            color: #334155; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        .container { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 20px; 
            /* 柔らかくポップな影と、鮮やかなアクセントライン */
            box-shadow: 0 20px 40px -10px rgba(13, 148, 136, 0.15); 
            border: 1px solid #e2e8f0;
            border-top: 6px solid #0ea5e9; 
            width: 100%; 
            max-width: 650px; 
        }
        h1 { 
            color: #0ea5e9; 
            margin-top: 0;
            margin-bottom: 5px; 
            font-weight: 900; 
            letter-spacing: 1px; 
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .form-group { margin-bottom: 24px; }
        label { 
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px; 
            font-size: 14px; 
            color: #475569; 
            font-weight: 700; 
        }
        label span.icon {
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 16px;
        }
        input, textarea, select { 
            width: 100%; 
            padding: 14px; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            color: #1e293b; 
            box-sizing: border-box; 
            font-size: 15px; 
            font-family: inherit;
            transition: all 0.2s ease;
        }
        /* 入力時に鮮やかなブルーでフォーカスされる演出 */
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #0ea5e9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }
        textarea { height: 100px; resize: vertical; }
        
        /* 決定ボタンはゲームの「START」風のグラデーション */
        button { 
            width: 100%; 
            background: linear-gradient(135deg, #0ea5e9, #3b82f6); 
            color: white; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: 900; 
            letter-spacing: 2px;
            margin-top: 20px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4);
        }
        button:hover { 
            transform: translateY(-2px) scale(1.01); 
            box-shadow: 0 15px 25px -5px rgba(14, 165, 233, 0.5); 
        }
        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AiDevation</h1>
        <div class="subtitle">▶ PERSONA SETUP _</div>
        
        <div class="form-group">
            <label><span class="icon">👤</span> Name ／ エージェント名</label>
            <input type="text" id="name" placeholder="例：戦略アナリスト、論理の守護者、批判的リサーチャー">
        </div>
        
        <div class="form-group">
            <label><span class="icon">🎭</span> Persona ／ キャラクター設定</label>
            <textarea id="persona" placeholder="例：徹底的な合理主義者。短期的な利益よりも長期的なスケーラビリティを重視し、感情論をデータとファクトで論破することを好む専門家。"></textarea>
        </div>
        
        <div class="form-group">
            <label><span class="icon">🧠</span> Expertise ／ 得意分野・固有スキル（カンマ区切り）</label>
            <input type="text" id="expertise" placeholder="例：データ分析, システム設計, リスク管理, コスト最適化">
        </div>
        
        <div class="form-group">
            <label><span class="icon">⚔️</span> Motivation ／ 勝利条件・目的</label>
            <input type="text" id="motivation" placeholder="例：提案の論理的整合性を検証し、潜在的な欠陥を特定する">
        </div>
        
        <div class="form-group">
            <label><span class="icon">🚫</span> Constraints ／ 縛りルール（制約）</label>
            <input type="text" id="constraints" placeholder="例：丁寧語は使用しない。1回の発言は150文字以内とする。相手の矛盾を必ず1箇所指摘する。">
        </div>
        
        <div class="form-group">
            <label><span class="icon">🔑</span> API Key</label>
            <input type="password" id="apikey" placeholder="AIzaSy...">
        </div>
        
        <div class="form-group">
            <label><span class="icon">🤖</span> Target Model ／ 脳内エンジン</label>
            <select id="model">
                <option value="gemini-1.5-flash">Gemini 1.5 Flash (推奨：高速ラリー用)</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro (重量級・高度推論用)</option>
            </select>
        </div>
        
        <button onclick="saveJSON()">GENERATE PERSONA</button>
    </div>

    <script>
        function saveJSON() {
            const data = {
                name: document.getElementById('name').value.trim(),
                persona: document.getElementById('persona').value.trim(),
                expertise: document.getElementById('expertise').value.split(',').map(s => s.trim()).filter(s => s !== ""),
                motivation: document.getElementById('motivation').value.trim(),
                constraints: document.getElementById('constraints').value.trim(),
                apikey: document.getElementById('apikey').value.trim(),
                model: document.getElementById('model').value
            };

            if (!data.name) {
                alert('エージェント名（Name）を入力してください。');
                return;
            }

            const blob = new Blob([JSON.stringify(data, null, 4)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${data.name}_persona.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
