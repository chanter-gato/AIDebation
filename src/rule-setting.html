<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DEVIATION - RULE SETTINGS</title>
    <link rel="stylesheet" href="css/style-rule.css">
</head>
<body>

    <div class="architect-container">
        
        <!-- ヘッダーエリア -->
        <header class="architect-header">
            <div class="status-badge">📜 SYSTEM RULE</div>
            <h1 class="architect-title">DEVATE RULE SETTINGS</h1>
            <p class="subtitle">ディベート全体を支配する共通ルールと環境ロジックを定義します</p>
        </header>

        <!-- メインフォームエリア -->
        <form class="architect-form" onsubmit="return false;">
            
            <!-- 行動指針 -->
            <div class="form-group">
                <label for="rule-guideline">
                    <span class="en">BEHAVIOR GUIDELINE</span>
                    <span class="jp">行動指針</span>
                </label>
                <textarea id="rule-guideline" rows="4" placeholder="例: 各AIは自身のモチベーションに忠実に従い、論理的かつ情熱的に反論を行うこと。相手を論破することのみを目的とせず、テーマの深掘りを目指す。"></textarea>
            </div>
            
            <!-- 会話ルール -->
            <div class="form-group">
                <label for="rule-chat">
                    <span class="en">CONVERSATION RULE</span>
                    <span class="jp">会話ルール</span>
                </label>
                <textarea id="rule-chat" rows="4" placeholder="例: 1回の発言は200文字以内とする。他者の発言をそのままオウム返しすることは禁止。必ず前の発言に対するリアクションを冒頭に含めること。"></textarea>
            </div>

            <!-- 拡張された最下部ボタンエリア（2段グリッド構成） -->
            <div class="action-actions-grid">
                <!-- 上段：基本操作（即座に反映・移動） -->
                <a href="index.html" class="btn btn-back">戻る</a>
                <button type="button" class="btn btn-save">保存</button>
                
                <!-- 下段：外部ファイル連携（共有用機能） -->
                <button type="button" class="btn btn-import" onclick="document.getElementById('file-input').click();">JSON読み込み</button>
                <button type="button" class="btn btn-export">JSON書き出し</button>
                
                <!-- 隠しファイルインプット -->
                <input type="file" id="file-input" accept=".json" style="display: none;">
            </div>

        </form>

    </div>

    <!-- 保存・インポート・エクスポートの制御ロジック -->
    <script>
        // 1. 【保存ボタン】LocalStorageにのみスマート保存してアリーナへ戻る
        document.querySelector('.btn-save').addEventListener('click', () => {
            const guideline = document.getElementById('rule-guideline').value;
            const chatRule = document.getElementById('rule-chat').value;

            const ruleData = {
                behavior_guideline: guideline,
                conversation_rule: chatRule,
                updated_at: new Date().toLocaleString('ja-JP')
            };

            localStorage.setItem('devate_rules', JSON.stringify(ruleData, null, 2));
            alert('設定をブラウザに保存しました！アリーナ画面に適用されます。');
            window.location.href = 'index.html';
        });

        // 2. 【JSON書き出しボタン】明示的にクリックされた時だけダウンロードを発生させる
        document.querySelector('.btn-export').addEventListener('click', () => {
            const guideline = document.getElementById('rule-guideline').value;
            const chatRule = document.getElementById('rule-chat').value;

            const ruleData = {
                behavior_guideline: guideline,
                conversation_rule: chatRule,
                updated_at: new Date().toLocaleString('ja-JP')
            };

            const jsonString = JSON.stringify(ruleData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'json/rule.json'; // ぽわぽわ戦士さんのご希望通り「rule.json」で固定出力
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        });

        // 3. 【JSON読み込み機能】ファイルが選択されたら一瞬で画面にインポート＆同期
        document.getElementById('file-input').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const rules = JSON.parse(e.target.result);
                    
                    // 画面の入力欄にセット
                    document.getElementById('rule-guideline').value = rules.behavior_guideline || '';
                    document.getElementById('rule-chat').value = rules.conversation_rule || '';
                    
                    // そのままLocalStorageにも自動同期
                    localStorage.setItem('devate_rules', e.target.result);
                    alert('外部のrule.jsonから設定を正常に読み込み、ブラウザへ同期しました！');
                } catch (error) {
                    alert('ファイルの読み込みに失敗しました。正しいJSON形式か確認してください。');
                }
            };
            reader.readAsText(file);
            // 連続で同じファイルをインポートできるようにリセット
            event.target.value = '';
        });

        // 4. 【初期化】画面を開いたとき、前回のデータがLocalStorageにあれば自動復元
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('devate_rules');
            if (savedData) {
                try {
                    const rules = JSON.parse(savedData);
                    if (rules.behavior_guideline) document.getElementById('rule-guideline').value = rules.behavior_guideline;
                    if (rules.conversation_rule) document.getElementById('rule-chat').value = rules.conversation_rule;
                } catch (e) {
                    console.error('保存データの自動復元に失敗しました:', e);
                }
            }
        });
    </script>

</body>
</html>
